name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run tests
        run: cd app && npm test

      # CI has no corpus: app/public/data links to the git-ignored build/dist.
      # So this runs `astro build` (not `npm run build`, whose data scripts
      # need the corpus) against an empty data directory. It passes only if
      # Vite compiled and bundled every page under src/pages, and rendering
      # then stopped at a missing public/data file. Compile errors, bad
      # imports and Svelte errors fail it. The data scripts, and anything that
      # breaks while rendering a page, are not covered.
      - name: Compile site (no corpus data)
        run: |
          mkdir -p build/dist
          cd app
          pages=$(find src/pages -name '*.astro' ! -name '_*' | sort)
          if [ -z "$pages" ]; then
            echo "::error::no pages under app/src/pages; nothing to compile"
            exit 1
          fi
          rm -rf dist
          log=$(mktemp)
          status=0
          PUBLIC_SHOW_PRIVATE=0 npx astro build > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error::astro build succeeded with no corpus data; this step expects it to stop at the first data read, so revisit the step"
            exit 1
          fi
          if ! grep -q "generating static routes" "$log" \
            || ! grep -q "ENOENT: no such file or directory, open 'public/data/" "$log"; then
            echo "::error::astro build failed before or apart from the missing corpus data"
            exit 1
          fi
          missing=0
          while IFS= read -r p; do
            if ! grep -rqF "$p" dist/.prerender 2>/dev/null; then
              echo "::error::not in the bundle: app/$p"
              missing=1
            fi
          done <<< "$pages"
          [ "$missing" -eq 0 ] || exit 1
          echo "compiled and bundled $(echo "$pages" | wc -l | tr -d ' ') pages"

      - name: Verify @shared imports resolve
        run: node scripts/verify-shared-imports.mjs

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo-level scripts are dependency-free (node: imports only), so
      # there is nothing to install. They gate the deploy and the link check,
      # which is exactly why their own tests should not be the untested part.
      - name: Run script tests
        run: npm run test:scripts

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: cd shared && npm ci

      - name: Run tests
        run: cd shared && npm test

      - name: Typecheck
        run: cd shared && npm run check

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pipeline dependencies
        run: cd pipeline && uv sync

      - name: Run corpus preflight fixture
        run: |
          cd pipeline
          uv run python -m aristotle_pipeline.preflight \
            tests/fixtures/preflight/valid/data \
            tests/fixtures/preflight/valid/manifests

      # Exit 5 (nothing collected) used to be tolerated here because the
      # pipeline had no tests; it has 301, so a run that collects none is a
      # broken gate, not an empty one.
      - name: Run pipeline tests
        run: cd pipeline && uv run --with pytest pytest

  workbench:
    name: workbench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Install dependencies
        run: cd workbench && npm ci

      - name: Build frontend
        run: cd workbench && npm run build

      - name: Run tests
        run: cd workbench && npm test

      # A green suite does not mean the app starts: a prop added to a
      # component's type but not to its destructuring threw at render with
      # every test passing (workbench/SESSION-HANDOFF.md).
      - name: Typecheck
        run: cd workbench && npx tsc --noEmit

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: cd desktop && npm ci

      - name: Build frontend
        run: cd desktop && npm run build

      - name: Run tests
        run: cd desktop && npm test

      - name: Typecheck
        run: cd desktop && npm run check
