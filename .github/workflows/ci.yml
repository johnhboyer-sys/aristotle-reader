name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run tests
        run: cd app && npm test

      # CI has no corpus: app/public/data links to the git-ignored build/dist.
      # So this runs `astro build` (not `npm run build`, whose data scripts
      # need the corpus) against an empty data directory. It passes only if
      # Vite compiled and bundled every page under src/pages, and rendering
      # then stopped at a missing public/data file. Compile errors, bad
      # imports and Svelte errors fail it. The data scripts, and anything that
      # breaks while rendering a page, are not covered.
      - name: Compile site (no corpus data)
        run: |
          mkdir -p build/dist
          cd app
          # Astro routes no file or directory whose name starts with _.
          pages=$(find src/pages -name '*.astro' ! -path '*/_*' | sort)
          if [ -z "$pages" ]; then
            echo "::error::no pages under app/src/pages; nothing to compile"
            exit 1
          fi
          rm -rf dist
          log=$(mktemp)
          status=0
          PUBLIC_SHOW_PRIVATE=0 npx astro build > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error::astro build succeeded with no corpus data; this step expects it to stop at the first data read, so revisit the step"
            exit 1
          fi
          if ! grep -q "generating static routes" "$log" \
            || ! grep -q "ENOENT: no such file or directory, open 'public/data/" "$log"; then
            echo "::error::astro build failed before or apart from the missing corpus data"
            exit 1
          fi
          missing=0
          while IFS= read -r p; do
            if ! grep -rqF "$p" dist/.prerender 2>/dev/null; then
              echo "::error::not in the bundle: app/$p"
              missing=1
            fi
          done <<< "$pages"
          [ "$missing" -eq 0 ] || exit 1
          echo "compiled and bundled $(echo "$pages" | wc -l | tr -d ' ') pages"

      - name: Verify @shared imports resolve
        run: node scripts/verify-shared-imports.mjs

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo-level scripts are dependency-free (node: imports only), so
      # there is nothing to install. They gate the deploy and the link check,
      # which is exactly why their own tests should not be the untested part.
      - name: Run script tests
        run: npm run test:scripts

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: cd shared && npm ci

      - name: Run tests
        run: cd shared && npm test

      - name: Typecheck
        run: cd shared && npm run check

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version   # 3.9 is gone from ubuntu-latest (26.04)

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pipeline dependencies
        run: cd pipeline && uv sync

      - name: Run corpus preflight fixture
        run: |
          cd pipeline
          uv run python -m aristotle_pipeline.preflight \
            tests/fixtures/preflight/valid/data \
            tests/fixtures/preflight/valid/manifests

      # Exit 5 (nothing collected) used to be tolerated here because the
      # pipeline had no tests; it has 301, so a run that collects none is a
      # broken gate, not an empty one.
      - name: Run pipeline tests
        run: cd pipeline && uv run --with pytest pytest

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: cd desktop && npm ci

      - name: Build frontend
        run: cd desktop && npm run build

      - name: Run tests
        run: cd desktop && npm test

      - name: Typecheck
        run: cd desktop && npm run check

  # The whole public site from a clean checkout: the Greek in corpus/greek/,
  # the translations in sources/, and the build's two outside inputs fetched
  # by pinned checksum. Nothing comes from a laptop (HANDOFF-PORTABILITY.md,
  # test 1). The bundle it uploads is the folder a mirror would serve.
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          (cd pipeline && uv sync)
          (cd app && npm ci)

      # 186 MB from Diogenes's own release; the archive and each file in it
      # are held to the sha256 pins in pipeline/aristotle_pipeline/inputs.py.
      - name: Fetch the Morpheus table and the LSJ
        run: |
          echo "DIOGENES_DATA=$RUNNER_TEMP/diogenes-data" >> "$GITHUB_ENV"
          cd pipeline && uv run python -m aristotle_pipeline.inputs fetch --dir "$RUNNER_TEMP/diogenes-data"

      # Every work from its public manifest, the corpus-wide gates, the app
      # build, and the link check.
      - name: Build the site
        run: npm run build:public

      # Runs the deploy's data gates, the leak check among them, before it
      # writes a byte.
      - name: Pack the bundle
        run: node scripts/make-bundle.mjs --out="$RUNNER_TEMP/aristotle-bundle.tar.gz"

      # Playwright is this step's tool and no package of the repo; nothing of
      # it ships. The check finds it in the npx cache this install fills.
      - name: No outside calls
        run: |
          npx --yes playwright@1.65.1 install --with-deps chromium
          node scripts/check-no-outside-calls.mjs

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: aristotle-bundle
          path: ${{ runner.temp }}/aristotle-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
