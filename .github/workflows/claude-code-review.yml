name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The review agent runs sandboxed with no interactive approver, so every
          # tool it needs must be pre-granted here. Without this the review "passes"
          # while unable to inspect anything (permission_denials > 0, zero output).
          # Skill is REQUIRED — the prompt invokes the code-review plugin as a
          # skill, and a denied Skill call silently guts the whole review. Bash
          # is granted whole: the reviewer redirects output and chains commands
          # (`gh pr diff > file; wc -l`), which never prefix-match narrow
          # Bash(cmd:*) rules (first live run: 13 denials). The runner is
          # ephemeral with contents:read, so the blast radius is the runner.
          claude_args: |
            --allowedTools "Skill,Bash,Grep,Glob,Read,WebFetch"

      - name: Fail if the review ran hamstrung
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            # Known benign cause: the action refuses to run when the PR modifies
            # this workflow file (anti-tampering validation vs the default
            # branch). Annotate loudly so the green check isn't mistaken for a
            # real review; it self-heals on the next PR after merge.
            echo "::warning title=No review ran::claude-code-action produced no execution file — this check did NOT review the PR (expected only on PRs that modify this workflow)."
            exit 0
          fi
          denials=$(jq '[.. | objects | .permission_denials? // empty | length] | max // 0' "$EXECUTION_FILE")
          if [ "$denials" -gt 0 ]; then
            echo "::error::Review agent was denied $denials tool call(s) — the review is vacuous, not green."
            jq -r '[.. | objects | .permission_denials? // empty] | flatten | .[] | "denied: \(.tool_name) \(.tool_input | tostring | .[0:200])"' "$EXECUTION_FILE" || true
            exit 1
          fi
          errored=$(jq '[.. | objects | select(.type? == "result") | .is_error] | any' "$EXECUTION_FILE")
          if [ "$errored" = "true" ]; then
            echo "::error::Claude Code reported an error result"
            exit 1
          fi

