[project]
name = "bonitz-pipeline"
version = "0.1.0"
description = "OCR pipeline for Bonitz Index Aristotelicus"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.30.0",
    # split_columns.py imports these at module top level (batch.py drives it).
    "Pillow>=10.0",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bonitz_pipeline"]
