<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Aristotle Reader</title>
    <script>
      // Theme before first paint (mirror of the site's ThemeInit.astro): saved
      // choice wins, else default to light — the parchment reader — regardless
      // of OS appearance. Kept inline so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('ne-theme');
          document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
