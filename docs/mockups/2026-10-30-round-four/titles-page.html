<title>Aristotle Reader Poster Titles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Sofia+Sans:wght@400;500;600;650&display=swap" rel="stylesheet">
<style>
/* Layout: a sticky bar of three choices (setting, poster, size) over a list
   of works. Each work opens with its photograph and a vote on it; under it,
   one entry per setting: the desktop poster and the phone poster side by
   side at one height, each drawn at full size and scaled, each with a vote. */
:root {
  --bg: #f4f4f1; --paper: #fbfbf9; --ink: #141413; --mid: #5d5c57; --line: #d9d8d2; --soft: #e9e8e3;
  --red: #e2382e; --red-ink: #b42419; --po-op: .82;
  --up: #2c6a43; --up-bg: #e1ede4; --dn-bg: #f5e2df;
  --wash-pale: #f4f4f1; --wash-dark: #121211; --title-deep: #b42419; --title-bright: #ff5a4d;
  --ink-dark: #8b1a10; --ink-cream: #f4efe6; --strip: rgb(244 244 241 / .6);
  --sans: "Sofia Sans", system-ui, sans-serif; --read: "Literata", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --paper: #171716; --ink: #ecebe6; --mid: #a7a59e; --line: #2d2c29; --soft: #24231f;
    --red: #ff5a4d; --red-ink: #ff7b70; --po-op: .86;
    --up: #86cfa1; --up-bg: #1b2a20; --dn-bg: #2f1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --paper: #171716; --ink: #ecebe6; --mid: #a7a59e; --line: #2d2c29; --soft: #24231f;
  --red: #ff5a4d; --red-ink: #ff7b70; --po-op: .86;
  --up: #86cfa1; --up-bg: #1b2a20; --dn-bg: #2f1c1a; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
a { color: var(--red-ink); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { padding-block: 34px 22px; }
.head h1 { margin: 0; font: 650 34px/1 var(--sans); text-transform: uppercase; letter-spacing: -.005em; color: var(--red-ink); }
.head .lede { margin: 12px 0 0; max-width: 40em; font: 400 17px/1.5 var(--read); color: var(--mid); }
.tally { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin-top: 18px; font: 500 14px/1.3 var(--sans); color: var(--mid); font-variant-numeric: tabular-nums; }
.tl-l { font: 600 12.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; }
.tl-items { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; }
.tl-i { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tl-n { color: var(--ink); font-weight: 600; }
.tl-up, .tl-dn { display: inline-flex; align-items: center; gap: 3px; }
.tl-up { color: var(--up); }
.tl-dn { color: var(--red-ink); }
.tally svg { width: 13px; height: 13px; }
.vmsg { margin: 10px 0 0; font: 500 14px/1.4 var(--sans); color: var(--red-ink); }
.vmsg:empty { display: none; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 34px; padding-block: 8px; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-width: 0; }
.lab { margin-right: 6px; font: 600 12.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--mid); }
.sub { margin: 0 2px 0 12px; font: 400 13px/1 var(--sans); color: var(--mid); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.chips button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 8px 6px; font: 600 14.5px/1 var(--sans); color: var(--mid); cursor: pointer; }
.chips button:hover { color: var(--ink); }
.chips button[aria-pressed="true"] { color: var(--red-ink); border-bottom-color: var(--red-ink); }
.grp select { min-width: 0; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 0; background: var(--paper); font: 500 15px/1 var(--sans); }
.grp select.alt { display: none; }
.step { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; }
.step:hover { color: var(--red-ink); }
#po-sel { width: 19em; }

.note { margin: 18px 0 0; font: 400 15px/1.45 var(--sans); color: var(--mid); }
.note b { font-weight: 650; color: var(--ink); margin-right: 6px; }
.note span { display: block; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px 22px; padding-block: 26px 40px; }
/* One setting, phone posters: the works flow in columns, their headers
   kept to one row height so the posters line up. */
.list.size-phone.one-set { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 40px 22px; }
.list.size-phone.one-set > .pg { grid-row: span 2; grid-template-rows: subgrid; row-gap: 12px; }

/* A work: its name, its photograph and the vote on it. */
.pg { display: grid; gap: 18px; min-width: 0; align-content: start; }
.pg-h { display: grid; gap: 6px; align-content: start; min-width: 0; padding-top: 12px; border-top: 2px solid var(--ink); }
.pg-t { margin: 0; font: 650 24px/1.15 var(--sans); }
.pg-ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; }
.pg-ph p { flex: 1 1 22em; min-width: 0; max-width: 62em; margin: 0; font: 400 14.5px/1.45 var(--sans); color: var(--mid); }
.pg-ph i { font-family: var(--read); font-style: italic; }
.pg-its { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px 22px; min-width: 0; align-content: start; }
.list.size-phone:not(.one-set) .pg-its { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }

/* A setting on that work. */
.it { display: grid; gap: 4px; min-width: 0; align-content: start; padding-top: 10px; border-top: 1px solid var(--line); }
.one-set .it { padding-top: 0; border-top: 0; }
.it-h { margin: 0; font: 650 17px/1.25 var(--sans); }
.it-d { margin: 0; font: 400 14.5px/1.4 var(--sans); color: var(--mid); }
.one-set .it-d { display: none; }
.pp { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, .7992fr); gap: 16px; align-items: start; margin-top: 8px; }
.size-desk .pp, .size-phone .pp { grid-template-columns: minmax(0, 1fr); }
.size-desk .fig.phone, .size-phone .fig.desk { display: none; }
.fig { margin: 0; min-width: 0; }
.fig.desk { max-width: 1440px; }
.size-phone .fig.phone { max-width: 390px; }
.fig figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; margin-top: 6px; font: 500 13px/1.3 var(--sans); color: var(--mid); font-variant-numeric: tabular-nums; }

/* Thumbs up and down: shown once the page's store answers. */
.vote { display: none; flex: none; gap: 4px; }
.votes-on .vote { display: inline-flex; }
.vb { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 30px; padding: 0; border: 1px solid var(--line); background: var(--paper); color: var(--mid); cursor: pointer; }
.vb:hover:not(:disabled) { color: var(--ink); border-color: var(--mid); }
.vb.up[aria-pressed="true"] { color: var(--up); background: var(--up-bg); border-color: var(--up); }
.vb.down[aria-pressed="true"] { color: var(--red-ink); background: var(--dn-bg); border-color: var(--red-ink); }
.vb:disabled { cursor: default; }
.vb:disabled:not([aria-pressed="true"]) { opacity: .45; }
.vote svg, .tally svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* A poster at full size (round four's dir-b.css), scaled to its box. */
.fit { position: relative; overflow: hidden; width: 100%; max-width: 100%; aspect-ratio: 1440 / 600; background: var(--soft); }
.fig.phone .fit { aspect-ratio: 390 / 488; }
.po { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.po.desk { width: 1440px; height: 600px; transform: scale(var(--kd, .5)); }
.po.phone { width: 390px; height: 488px; transform: scale(var(--kp, .7)); }
.po img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
/* Photo treatments: a wash laid between the photograph and the title, so
   the red always lands on ground clearly lighter or darker than itself.
   Each is the lightest that keeps every poster readable: no more than 5% of
   any title's letters below 2:1 against the photograph behind them
   (titles-legibility.py). */
.po::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.tr-pale .po::after, .tr-gray .po::after { background: var(--wash-pale); opacity: .6; }
.tr-gray .po img { filter: grayscale(1); }
.tr-dark .po::after { background: var(--wash-dark); opacity: .7; }
/* Three more that leave the photograph at full strength. Own colour: no
   wash, the title solid, in whichever of dark red and cream stands out from
   more of the photograph (titles.py). Strips: the Pale wash behind each line
   of the title only. Above: the title on the page, the photograph whole
   below it. */
.tr-own .po[data-ink="dark"] .po-t { color: var(--ink-dark); opacity: 1; }
.tr-own .po[data-ink="cream"] .po-t { color: var(--ink-cream); opacity: 1; }
.tr-strip .po-t { color: var(--title-deep); opacity: .92; }
.tr-strip .po-t > span { width: fit-content; }
.tr-strip .po-t > span, .tr-strip .po-t .ln { background: var(--strip); box-shadow: -12px 0 0 var(--strip), 12px 0 0 var(--strip); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.tr-above .fit { aspect-ratio: auto; }
.tr-above .po { display: flex; flex-direction: column; height: auto; background: var(--bg); }
.tr-above .po img { position: static; flex: none; height: 600px; }
.tr-above .po.phone img { height: 488px; }
.tr-above .po .po-t { order: -1; position: static; display: block; padding: 30px 72px 26px; color: var(--red-ink); opacity: 1; }
.tr-above .po.phone .po-t { padding: 18px 18px 16px; }
.po-t {
  position: absolute; left: 72px; right: 72px; top: 0; margin: 0; padding: 30px 0 0;
  font: 600 var(--fz)/.9 var(--sans); letter-spacing: -.012em; text-transform: uppercase;
  text-align: justify; text-align-last: left; hyphens: none; overflow-wrap: normal;
  color: var(--red); opacity: var(--po-op); z-index: 1;
}
.po.phone .po-t { left: 18px; right: 18px; padding-top: 18px; }
.tr-pale .po-t, .tr-gray .po-t { color: var(--title-deep); opacity: .92; }
.tr-dark .po-t { color: var(--title-bright); opacity: .92; }
.po-t.set { text-align: left; letter-spacing: 0; }
.po-t.spread, .po-t.middle { bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 26px; }
.po-t.middle { justify-content: center; }
.po.phone .po-t.spread, .po.phone .po-t.middle { padding-bottom: 16px; }

.foot { padding-block: 8px 44px; font: 400 14px/1.5 var(--sans); color: var(--mid); }
.foot p { margin: 0; }

@media (max-width: 760px) {
  .head { padding-block: 24px 16px; }
  .head h1 { font-size: 28px; }
  .head .lede { font-size: 16px; }
  .chips, .lab { display: none; }
  .grp select.alt { display: block; }
  .bar-in { gap: 8px; }
  #g-set, #g-size { flex: 1 1 40%; }
  #g-set select, #g-size select { width: 100%; }
  #g-tr { order: 3; flex: none; }
  #tr-sel { width: 7.5em; }
  #g-po { order: 4; flex: 1 1 12em; flex-wrap: nowrap; }
  #po-sel { flex: 1 1 auto; width: auto; }
  .pp { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .fig.phone { max-width: 390px; }
  .list { gap: 44px; }
  .pg-t { font-size: 21px; }
}
</style>

<header class="head wrap">
  <h1>Poster titles</h1>
  <p class="lede">B’s poster titles set seven ways, on the home page and every work, desktop and phone.</p>
  <div class="tally" id="tally" hidden>
    <span class="tl-l">Your votes</span>
    <span class="tl-items" id="tally-items"></span>
  </div>
  <p class="vmsg" id="vmsg" role="status" aria-live="polite"></p>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <div class="grp" id="g-set">
      <span class="lab" id="lab-set">Setting</span>
      <div class="chips" role="group" aria-labelledby="lab-set" id="set-chips"></div>
      <select class="alt" id="set-sel" aria-label="Setting"></select>
    </div>
    <div class="grp" id="g-po">
      <span class="lab" id="lab-po">Poster</span>
      <button type="button" class="step" id="po-prev" aria-label="Previous poster"><svg viewBox="0 0 10 16" width="9" height="14" aria-hidden="true"><path d="M8 2 2 8l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <select id="po-sel" aria-labelledby="lab-po"></select>
      <button type="button" class="step" id="po-next" aria-label="Next poster"><svg viewBox="0 0 10 16" width="9" height="14" aria-hidden="true"><path d="m2 2 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>
    <div class="grp" id="g-size">
      <span class="lab" id="lab-size">Size</span>
      <div class="chips" role="group" aria-labelledby="lab-size" id="size-chips"></div>
      <select class="alt" id="size-sel" aria-label="Size"></select>
    </div>
    <div class="grp" id="g-tr">
      <span class="lab" id="lab-tr">Photo</span>
      <div class="chips" role="group" aria-labelledby="lab-tr" id="tr-chips"></div>
      <select class="alt" id="tr-sel" aria-label="Photo"></select>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="note" id="note" hidden></p>
  <div class="list size-both" id="list"></div>
</main>

<footer class="foot wrap">
  <p>The posters as in <a href="https://claude.ai/artifact/PNuw2yLEayHuLAn7FjivTn">round four</a>. Photographs: J. Paul Getty Museum, Open Content (CC0).</p>
</footer>

<script>
/*__TL__*/
</script>
<script>
(function () {
  'use strict';
  const D = /*__DATA__*/{};
  const TL = window.TL;
  const SETS = [
    { id: 'now', name: 'Now', desc: 'Round four: one size, the words wrapped.' },
    { id: 'justified', name: 'Justified', group: 'Whole words', desc: 'One size, bigger; word spaces stretched to the width.' },
    { id: 'stacked', name: 'Stacked', group: 'Whole words', desc: 'Each line at its own size, filling the width.' },
    { id: 'stacked-spread', name: 'Stacked and spread', group: 'Whole words', desc: 'Stacked, the lines spread from top to bottom.' },
    { id: 'block', name: 'Block', group: 'Words break', desc: 'Words break between letters; every line meets both edges.' },
    { id: 'block-big', name: 'Bigger block', group: 'Words break', desc: 'Block, bigger, with a little more letter spacing.' },
    { id: 'block-spread', name: 'Block spread', group: 'Words break', desc: 'Bigger block, the lines spread from top to bottom.' },
  ];
  const SIZES = [['both', 'Desktop and phone'], ['desk', 'Desktop'], ['phone', 'Phone']];
  // What lies between the photograph and the title.
  const TREATS = [
    { id: 'now', name: 'As now', desc: 'The photograph at full strength; the title in red, 82% opaque.' },
    { id: 'pale', name: 'Pale', label: 'Pale photograph', desc: 'The photograph washed pale; the title in a darker red.' },
    { id: 'gray', name: 'Gray', label: 'Gray photograph', desc: 'The photograph in gray, washed pale; the title in a darker red.' },
    { id: 'dark', name: 'Dark', label: 'Dark photograph', desc: 'The photograph darkened; the title in a brighter red.' },
    { id: 'own', name: 'Own colour', label: 'Own colour', desc: 'The photograph at full strength; the title solid, dark red on a light photograph, cream on a dark one.' },
    { id: 'strip', name: 'Strips', label: 'Strips', desc: 'The pale wash behind each line of the title only; the rest of the photograph at full strength.' },
    { id: 'above', name: 'Above', label: 'Title above', desc: 'The title on the page, above the photograph; the photograph whole.' },
  ];
  const KINDS = [['desktop', 'desk', 'Desktop', 1440, 1600, 667], ['phone', 'phone', 'Phone', 390, 720, 900]];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PO = Object.fromEntries(D.posters.map((p) => [p.id, p]));
  const ORDER = D.posters.map((p) => p.id);
  const $ = (id) => document.getElementById(id);
  const list = $('list');

  // Thumbs: Feather's thumbs-up and thumbs-down (MIT), in the text colour.
  const THUMB = {
    up: '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>',
    down: '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>',
  };
  // A vote is one document in the store's `votes` collection, named for
  // what it judges: t:<setting>--<work>:<desk|phone> for a poster's title,
  // p:<work> for a work's photograph.
  const vote = (key, label) => `<span class="vote" data-key="${key}">${['up', 'down'].map((v) => `<button type="button" class="vb ${v}" data-v="${v}" aria-pressed="false" aria-label="${v === 'up' ? 'Thumbs up' : 'Thumbs down'}: ${esc(label)}" disabled>${THUMB[v]}</button>`).join('')}</span>`;
  const what = (key) => {
    const m = /^t:(.+?)--(.+):(desk|phone)$/.exec(key);
    return m ? { kind: 'title', set: m[1], po: m[2], size: m[3] } : { kind: 'photo', po: key.slice(2) };
  };

  // Every setting on every poster, in one fixed order, grouped by work; the
  // choices only show and hide them.
  const entry = (s, p) => `<article class="it" id="${s.id}--${p.id}" data-set="${s.id}" data-po="${p.id}" hidden>
      <h3 class="it-h">${esc(s.name)}</h3>
      <p class="it-d">${esc(s.desc)}</p>
      <div class="pp">${KINDS.map(([kind, cut, label, , w, h]) => `<figure class="fig ${cut}">
        <div class="fit"><div class="po ${cut}" data-ink="${p.ink[cut] || 'dark'}" style="--fz:${TL.now(p.title, kind, p.kind)}px"><img src="img/${cut}/${p.photo}.jpg" alt="${esc(p.alt)}" width="${w}" height="${h}" loading="lazy" decoding="async"><div class="po-t"></div></div></div>
        <figcaption><span>${label} · <span class="px"></span></span>${vote(`t:${s.id}--${p.id}:${cut}`, `${s.name}, ${p.name}, ${label.toLowerCase()}`)}</figcaption>
      </figure>`).join('')}</div>
    </article>`;
  list.innerHTML = D.posters.map((p) => `<section class="pg" id="po-${p.id}" data-po="${p.id}">
      <header class="pg-h">
        <h2 class="pg-t">${esc(p.name)}</h2>
        <div class="pg-ph"><p>Photograph: <i>${esc(p.ph.title)}</i>, ${esc(p.ph.maker)}, ${esc(p.ph.date)}. ${p.ph.cap}</p>${vote(`p:${p.id}`, `the photograph for ${p.name}`)}</div>
      </header>
      <div class="pg-its">${SETS.map((s) => entry(s, p)).join('')}</div>
    </section>`).join('');
  const works = [...list.querySelectorAll('.pg')];
  const items = [...list.querySelectorAll('.it')];

  // The controls.
  let g = '';
  $('set-chips').innerHTML = [{ id: 'all', name: 'All' }, ...SETS].map((s) => {
    const sub = s.group && s.group !== g ? `<span class="sub">${esc((g = s.group))}</span>` : '';
    return `${sub}<button type="button" data-set-b="${s.id}" aria-pressed="false">${esc(s.name)}</button>`;
  }).join('');
  $('set-sel').innerHTML = [{ id: 'all', name: 'All settings' }, ...SETS].map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('size-chips').innerHTML = SIZES.map(([k, l]) => `<button type="button" data-size-b="${k}" aria-pressed="false">${l}</button>`).join('');
  $('size-sel').innerHTML = SIZES.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  $('tr-chips').innerHTML = TREATS.map((t) => `<button type="button" data-tr-b="${t.id}" aria-pressed="false">${esc(t.name)}</button>`).join('');
  $('tr-sel').innerHTML = TREATS.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const groups = [];
  for (const p of D.posters) {
    if (!groups.length || groups[groups.length - 1].label !== p.group) groups.push({ label: p.group, posters: [] });
    groups[groups.length - 1].posters.push(p);
  }
  $('po-sel').innerHTML = '<option value="all">All posters</option>' + groups.map((x) => {
    const opts = x.posters.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    return x.label ? `<optgroup label="${esc(x.label)}">${opts}</optgroup>` : opts;
  }).join('');

  // Titles: measured in Sofia Sans SemiBold once the font is in.
  const cv = document.createElement('canvas').getContext('2d');
  const W100 = new Map();
  const w100 = (s) => {
    let v = W100.get(s);
    if (v === undefined) { v = cv.measureText(s).width; W100.set(s, v); }
    return v;
  };
  let fonts = false;
  function fill(it) {
    if (!fonts || it.dataset.done) return;
    const s = it.dataset.set;
    const p = PO[it.dataset.po];
    for (const [kind, cut] of KINDS) {
      const fig = it.querySelector(`.fig.${cut}`);
      const t = fig.querySelector('.po-t');
      const px = fig.querySelector('.px');
      t.className = 'po-t';
      if (s === 'now') {
        t.innerHTML = `<span class="ln">${esc(p.title)}</span>`;
        px.textContent = `${TL.now(p.title, kind, p.kind)} px`;
        continue;
      }
      const lines = TL.set(p.title, kind, s, w100);
      t.innerHTML = TL.html(lines);
      t.classList.add('set');
      const at = TL.place(s, lines);
      if (at !== 'top') t.classList.add(at);
      const fs = lines.map((x) => Math.round(+x.f.toFixed(1)));
      const lo = Math.min(...fs);
      const hi = Math.max(...fs);
      px.textContent = lo === hi ? `${lo} px` : `${lo}–${hi} px`;
    }
    it.dataset.done = '1';
  }

  // The choices, kept for this viewer only.
  const KEY = 'aristotle-poster-titles';
  let S = { set: 'all', po: 'home', size: 'both', tr: 'now' };
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (v && (v.set === 'all' || SETS.some((s) => s.id === v.set)) && (v.po === 'all' || PO[v.po]) && SIZES.some(([k]) => k === v.size)) S = { ...S, ...v, tr: TREATS.some((t) => t.id === v.tr) ? v.tr : 'now' };
  } catch (e) { /* no storage: start fresh */ }

  function scale() {
    for (const [, cut, , w] of KINDS) {
      const f = list.querySelector(`.it:not([hidden]) .fig.${cut} .fit`);
      const fw = f ? f.getBoundingClientRect().width : 0;
      if (fw) list.style.setProperty(cut === 'desk' ? '--kd' : '--kp', (fw / w).toFixed(5));
    }
    // Above: the poster grows by its title, so each box takes its poster's
    // scaled height.
    for (const f of list.querySelectorAll('.it:not([hidden]) .fit')) {
      const po = f.firstElementChild;
      f.style.height = S.tr === 'above' && po.offsetWidth ? `${(po.offsetHeight * f.getBoundingClientRect().width) / po.offsetWidth}px` : '';
    }
  }
  function apply() {
    for (const w of works) w.hidden = !(S.po === 'all' || w.dataset.po === S.po);
    for (const it of items) {
      const show = (S.set === 'all' || it.dataset.set === S.set) && (S.po === 'all' || it.dataset.po === S.po);
      it.hidden = !show;
      if (show) fill(it);
    }
    list.className = `list size-${S.size} tr-${S.tr}${S.set === 'all' ? '' : ' one-set'}`;
    for (const b of document.querySelectorAll('[data-set-b]')) b.setAttribute('aria-pressed', String(b.dataset.setB === S.set));
    for (const b of document.querySelectorAll('[data-size-b]')) b.setAttribute('aria-pressed', String(b.dataset.sizeB === S.size));
    for (const b of document.querySelectorAll('[data-tr-b]')) b.setAttribute('aria-pressed', String(b.dataset.trB === S.tr));
    $('tr-sel').value = S.tr;
    $('set-sel').value = S.set;
    $('size-sel').value = S.size;
    $('po-sel').value = S.po;
    const one = SETS.find((s) => s.id === S.set);
    const tr = TREATS.find((t) => t.id === S.tr && t.id !== 'now');
    const bits = [one && `<span><b>${esc(one.name)}</b>${esc(one.desc)}</span>`, tr && `<span><b>${esc(tr.label)}</b>${esc(tr.desc)}</span>`].filter(Boolean);
    $('note').hidden = !bits.length;
    $('note').innerHTML = bits.join('');
    scale();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* no storage */ }
  }
  const go = (patch) => { S = { ...S, ...patch }; apply(); };
  const step = (d) => {
    const i = ORDER.indexOf(S.po);
    go({ po: i < 0 ? ORDER[d > 0 ? 0 : ORDER.length - 1] : ORDER[(i + d + ORDER.length) % ORDER.length] });
  };

  // Votes live in the artifact's own store, which only the page's owner
  // writes and everyone who can open the page reads. Without the store
  // (signed out, or the page opened outside claude.ai) the thumbs stay
  // hidden.
  const VOTES = new Map();
  let store = null;
  let mayVote = false;
  const busy = new Set();
  const say = (t) => { $('vmsg').textContent = t; };
  function paint() {
    for (const el of document.querySelectorAll('.vote')) {
      const v = VOTES.get(el.dataset.key) || '';
      for (const b of el.children) {
        b.setAttribute('aria-pressed', String(b.dataset.v === v));
        b.disabled = !mayVote;
      }
    }
    const t = Object.fromEntries([...SETS.map((s) => s.id), 'photo'].map((k) => [k, { up: 0, down: 0 }]));
    for (const [k, v] of VOTES) {
      const w = what(k);
      const c = t[w.kind === 'photo' ? 'photo' : w.set];
      if (c) c[v]++;
    }
    $('tally-items').innerHTML = [...SETS.map((s) => [s.id, s.name]), ['photo', 'Photographs']].map(([k, n]) => `<span class="tl-i" data-k="${k}"><span class="tl-n">${esc(n)}</span><span class="tl-up">${THUMB.up}<span class="sr">up</span> <b class="n">${t[k].up}</b></span><span class="tl-dn">${THUMB.down}<span class="sr">down</span> <b class="n">${t[k].down}</b></span></span>`).join('');
  }
  async function cast(key, v) {
    if (!store || !mayVote || busy.has(key)) return;
    const was = VOTES.get(key) || '';
    const next = was === v ? '' : v;
    busy.add(key);
    if (next) VOTES.set(key, next); else VOTES.delete(key);
    paint();
    say('');
    try {
      const ref = store.collection('votes').doc(key);
      if (next) await ref.set({ ...what(key), vote: next, at: new Date().toISOString() });
      else await ref.delete();
    } catch (e) {
      if (was) VOTES.set(key, was); else VOTES.delete(key);
      paint();
      say(e && e.code === 'quota_exceeded' ? 'The page’s store is full, so that vote was not saved.' : 'That vote was not saved. Try again.');
    } finally {
      busy.delete(key);
    }
  }
  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(async ([db, user]) => {
      if (!db) return;
      store = db;
      mayVote = user ? await user.isOwner() : false;
      document.documentElement.classList.add('votes-on');
      $('tally').hidden = false;
      paint();
      db.collection('votes').onSnapshot((snap) => {
        VOTES.clear();
        for (const d of snap.docs) {
          const x = d.data();
          if (x && (x.vote === 'up' || x.vote === 'down')) VOTES.set(d.id, x.vote);
        }
        paint();
      }, () => {
        mayVote = false;
        paint();
        say('Votes cannot be saved or shown on this view.');
      });
    }).catch(() => { /* no store: the thumbs stay hidden */ });
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.classList.contains('vb')) cast(b.parentElement.dataset.key, b.dataset.v);
    else if (b.dataset.setB) go({ set: b.dataset.setB });
    else if (b.dataset.sizeB) go({ size: b.dataset.sizeB });
    else if (b.dataset.trB) go({ tr: b.dataset.trB });
    else if (b.id === 'po-prev') step(-1);
    else if (b.id === 'po-next') step(1);
  });
  $('set-sel').addEventListener('change', (e) => go({ set: e.target.value }));
  $('size-sel').addEventListener('change', (e) => go({ size: e.target.value }));
  $('tr-sel').addEventListener('change', (e) => go({ tr: e.target.value }));
  $('po-sel').addEventListener('change', (e) => go({ po: e.target.value }));
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest('select, input, textarea')) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });
  new ResizeObserver(scale).observe(list);
  apply();

  // Set the shown titles first, then the rest, a few at a time. A font
  // that has not come in after 4 seconds gets a stand-in for the moment,
  // and every title is set again when it arrives.
  const SAMPLE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ,.’ ';
  let pass = 0;
  function setAll(final) {
    const run = ++pass;
    fonts = true;
    cv.font = '600 100px "Sofia Sans"';
    W100.clear();
    for (const it of items) delete it.dataset.done;
    apply();
    const rest = items.filter((it) => !it.dataset.done);
    const next = () => {
      if (run !== pass) return;
      rest.splice(0, 12).forEach(fill);
      if (rest.length) setTimeout(next, 0);
      else if (final) document.documentElement.dataset.titles = 'set';
    };
    next();
  }
  const early = setTimeout(() => setAll(false), 4000);
  document.fonts.load('600 100px "Sofia Sans"', SAMPLE).catch(() => []).then(() => {
    clearTimeout(early);
    setAll(true);
  });
})();
</script>
