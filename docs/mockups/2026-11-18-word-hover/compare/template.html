<title>Four Translations, NE I.2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Sofia+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap">
<style>
/* Layout: one column of eleven Greek sentences; under each, the four versions side by side, then the notes table. Same type and palette as the alignment pages. */
:root {
  --bg: #ebeae4; --paper: #f1f0eb; --ink: #141413; --mid: #5d5c57; --faint: #6a6964;
  --line: #d9d8d2; --hl: #f3e2a4; --grp: #c9a227; --red-ink: #b42419;
  --k-phrasing: #3d6a8a; --k-supplied: #9a6a00; --k-construction: #7a4f8c; --k-omitted: #8a8984;
  --sans: "Sofia Sans", system-ui, sans-serif;
  --text: "Gentium Book Plus", Georgia, serif;
  --display: Oswald, "Sofia Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --paper: #171716; --ink: #e0dfd9; --mid: #a7a59e; --faint: #8d8b85;
  --line: #2d2c29; --hl: #5a4917; --grp: #b38a1e; --red-ink: #ff7b70;
  --k-phrasing: #8db8d6; --k-supplied: #d9a53a; --k-construction: #c39bd3; --k-omitted: #8d8b85; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121211; --paper: #171716; --ink: #e0dfd9; --mid: #a7a59e; --faint: #8d8b85;
  --line: #2d2c29; --hl: #5a4917; --grp: #b38a1e; --red-ink: #ff7b70;
  --k-phrasing: #8db8d6; --k-supplied: #d9a53a; --k-construction: #c39bd3; --k-omitted: #8d8b85; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 36px; }
header { display: grid; gap: 14px; }
.where { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mid); }
h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.who { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.who div { background: var(--paper); padding: 10px 12px; display: grid; gap: 2px; }
.who b { font-weight: 600; }
.who span { color: var(--mid); font-size: 13px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip:focus-visible, tr:focus-visible { outline: 2px solid var(--grp); outline-offset: 2px; }
.patterns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pat { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.pat p { margin: 0; }
.pat .t { color: var(--mid); font-size: 13px; }
.kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--c); }
section.s { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 22px; }
.sh { display: flex; gap: 14px; align-items: baseline; }
.sn { font-family: var(--display); font-size: 18px; color: var(--mid); min-width: 2.2em; font-variant-numeric: tabular-nums; }
.greek { font-family: var(--text); font-size: 21px; line-height: 1.45; }
.greek .g { border-radius: 2px; }
.greek .g.om { text-decoration: underline dotted var(--k-omitted); text-underline-offset: 5px; }
.vers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ver { background: var(--paper); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.ver .n { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mid); }
.ver .e { font-family: var(--text); font-size: 16px; line-height: 1.5; }
.e .sup { box-shadow: inset 0 -3px 0 var(--grp); }
.on { background: var(--hl); }
.wrap > *, main > *, section.s > * { min-width: 0; }
.notes { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mid); padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.gk { font-family: var(--text); font-size: 16px; white-space: nowrap; }
td.en { font-family: var(--text); font-size: 15px; }
td.en.none { color: var(--faint); }
td.cm { color: var(--mid); font-size: 13px; }
tr.note { cursor: default; }
tr.note.on td { background: var(--hl); }
tr.note[hidden] { display: none; }
@media (max-width: 900px) { .vers, .who { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .vers, .who { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 25px; } .greek { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="where">Nicomachean Ethics · Book I · Chapter 2 · 1094a18–1094b10</div>
    <h1>Four Translations, NE I.2</h1>
    <div class="who" id="who"></div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="patterns" id="patterns"></div>
  <main id="sents" style="display:grid;gap:36px"></main>
</div>

<script>
const D = __DATA__;
const TR = ["Rackham", "Ross", "Ostwald", "Peters"];
const YEAR = {Rackham: 1926, Ross: 1925, Ostwald: 1962, Peters: 1893};
const KINDS = ["supplied", "phrasing", "construction", "omitted"];
const LABEL = {supplied: "Supplied", phrasing: "Phrasing", construction: "Construction", omitted: "Omitted"};
const show = new Set(KINDS);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// Where a note's English sits in a rendering: each " … " part as a whole-word match, in order.
function spans(text, by) {
  if (!by) return [];
  const out = []; let from = 0;
  for (const part of by.split(" … ")) {
    const p = part.trim(); if (!p) continue;
    const re = new RegExp("(^|[^A-Za-z’'-])(" + p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-z’'-])", "g");
    re.lastIndex = from; let m = re.exec(text);
    if (!m) { re.lastIndex = 0; m = re.exec(text); }
    if (!m) continue;
    const s = m.index + m[1].length; out.push([s, s + p.length]); from = s + p.length;
  }
  return out;
}

// Header: each translator's length and how often he supplies or leaves out.
const stat = Object.fromEntries(TR.map(t => [t, {words: 0, supplied: 0, omitted: 0}]));
for (const t of TR) stat[t].words = D.words[t];
for (const s of D.sentences) for (const n of s.notes) for (const t of TR) {
  if (n.kind === "supplied" && n.by[t]) stat[t].supplied++;
  if (n.kind === "omitted" && !n.by[t]) stat[t].omitted++;
}
document.getElementById("who").innerHTML = TR.map(t =>
  `<div><b>${t}, ${YEAR[t]}</b><span>${stat[t].words} words · supplies in ${stat[t].supplied} places · leaves ${stat[t].omitted} words out</span></div>`).join("");

const count = Object.fromEntries(KINDS.map(k => [k, 0]));
D.sentences.forEach(s => s.notes.forEach(n => count[n.kind]++));
const chips = document.getElementById("chips");
for (const k of KINDS) {
  const b = el("button", "chip", `<i></i>${LABEL[k]} <span>${count[k]}</span>`);
  b.style.setProperty("--c", `var(--k-${k})`); b.setAttribute("aria-pressed", "true"); b.id = "chip-" + k;
  b.onclick = () => { show.has(k) ? show.delete(k) : show.add(k); b.setAttribute("aria-pressed", show.has(k)); filter(); };
  chips.append(b);
}

document.getElementById("patterns").innerHTML = D.patterns.map(p =>
  `<div class="pat"><span class="kind" style="--c:var(--k-${p.kind})">${LABEL[p.kind] || p.kind}</span><p>${esc(p.summary)}</p><p class="t">${esc(p.translators)}</p></div>`).join("");

const main = document.getElementById("sents");
D.sentences.forEach(s => {
  const sec = el("section", "s"); sec.id = "s" + s.n;
  const omitted = new Set(s.notes.filter(n => n.kind === "omitted").flatMap(n => n.ids));
  const gk = s.ids.map((id, i) => `<span class="g${omitted.has(id) ? " om" : ""}" data-id="${id}">${esc(s.forms[i])}</span>`).join(" ");
  sec.append(el("div", "sh", `<span class="sn">${s.n}</span><div class="greek">${gk}</div>`));

  const vers = el("div", "vers");
  for (const t of TR) {
    const text = s.renderings[t] || "";
    const marks = [];   // [start, end, noteIndex]
    s.notes.forEach((n, i) => spans(text, n.by[t]).forEach(([a, b]) => marks.push([a, b, i])));
    const cuts = [...new Set([0, text.length, ...marks.flatMap(m => [m[0], m[1]])])].sort((a, b) => a - b);
    let html = "";
    for (let j = 0; j < cuts.length - 1; j++) {
      const a = cuts[j], b = cuts[j + 1], on = marks.filter(m => m[0] <= a && m[1] >= b).map(m => m[2]);
      const sup = on.some(i => s.notes[i].kind === "supplied");
      html += on.length ? `<span class="${sup ? "sup" : ""}" data-n="${on.join(" ")}">${esc(text.slice(a, b))}</span>` : esc(text.slice(a, b));
    }
    const v = el("div", "ver", `<span class="n">${t}</span><div class="e">${html || "<span style='color:var(--faint)'>–</span>"}</div>`);
    vers.append(v);
  }
  sec.append(vers);

  const wrap = el("div", "notes");
  const tb = el("table");
  tb.innerHTML = `<thead><tr><th>Greek</th><th>Kind</th>${TR.map(t => `<th>${t}</th>`).join("")}<th>Note</th></tr></thead>`;
  const body = el("tbody");
  s.notes.forEach((n, i) => {
    const tr = el("tr", "note"); tr.dataset.kind = n.kind; tr.dataset.i = i; tr.tabIndex = 0;
    tr.innerHTML = `<td class="gk">${esc(n.greek)}</td><td><span class="kind" style="--c:var(--k-${n.kind})">${LABEL[n.kind]}</span></td>` +
      TR.map(t => n.by[t] ? `<td class="en">${esc(n.by[t])}</td>` : `<td class="en none">–</td>`).join("") + `<td class="cm">${esc(n.comment)}</td>`;
    const light = on => {
      tr.classList.toggle("on", on);
      sec.querySelectorAll(".e [data-n]").forEach(x => { if (x.dataset.n.split(" ").includes(String(i))) x.classList.toggle("on", on); });
      sec.querySelectorAll(".greek .g").forEach(x => { if (n.ids.includes(x.dataset.id)) x.classList.toggle("on", on); });
    };
    tr.addEventListener("mouseenter", () => light(true)); tr.addEventListener("mouseleave", () => light(false));
    tr.addEventListener("focus", () => light(true)); tr.addEventListener("blur", () => light(false));
    body.append(tr);
  });
  tb.append(body); wrap.append(tb); sec.append(wrap);

  // Pointing at English or Greek lights its notes too.
  sec.addEventListener("mouseover", e => {
    const x = e.target.closest(".e [data-n], .greek .g"); if (!x) return;
    const idx = x.dataset.n ? x.dataset.n.split(" ") : [...body.children].filter(r => s.notes[r.dataset.i].ids.includes(x.dataset.id)).map(r => r.dataset.i);
    idx.forEach(i => body.children[i] && !body.children[i].hidden && body.children[i].dispatchEvent(new Event("mouseenter")));
    x.addEventListener("mouseleave", () => idx.forEach(i => body.children[i] && body.children[i].dispatchEvent(new Event("mouseleave"))), {once: true});
  });
  main.append(sec);
});

function filter() {
  document.querySelectorAll("tr.note").forEach(r => r.hidden = !show.has(r.dataset.kind));
  document.querySelectorAll(".e .sup").forEach(x => x.style.boxShadow = show.has("supplied") ? "" : "none");
}
</script>
