<title>NE I.2 Alignment Rulings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Sofia+Sans:wght@400;500;600;700&display=swap">
<style>
/* One item at a time: Greek sentence over English sentence, the candidate renderings below, a strip of all items on top. Tokens are the reader's own (dir-b). */
:root {
  --bg: #ebeae4; --paper: #f1f0eb; --ink: #141413; --mute: #5f5e59; --faint: #8c8b85; --line: #d9d8d2;
  --red-ink: #b42419; --hl: #f3e2a4; --grp: #c9a227; --ok: #2f6b3a;
  --greek: "Gentium Book Plus", "Gentium Plus", "Palatino Linotype", Georgia, serif;
  --sans: "Sofia Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --paper: #1a1a18; --ink: #e0dfd9; --mute: #a3a29b; --faint: #77766f; --line: #2d2c29;
  --red-ink: #ff7b70; --hl: #5a4917; --grp: #c9a227; --ok: #7fc28a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121211; --paper: #1a1a18; --ink: #e0dfd9; --mute: #a3a29b; --faint: #77766f; --line: #2d2c29;
  --red-ink: #ff7b70; --hl: #5a4917; --grp: #c9a227; --ok: #7fc28a; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.work { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.count { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--red-ink); }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { width: 22px; height: 22px; border: 1px solid var(--faint); background: var(--paper); border-radius: 3px; padding: 0; cursor: pointer; }
.chip.check { border-style: dashed; }
.chip.done { background: var(--mute); border-color: var(--mute); }
.chip.cur { outline: 2px solid var(--red-ink); outline-offset: 1px; }
.chip:focus-visible { outline: 2px solid var(--red-ink); }

.meta { display: flex; gap: 14px; align-items: baseline; font-size: 13px; color: var(--mute); letter-spacing: .04em; }
.meta .ref { color: var(--red-ink); font-variant-numeric: tabular-nums; }
.meta .kind { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.meta .saved { color: var(--ok); }

.greek, .eng { font-family: var(--greek); line-height: 1.75; max-width: 70ch; }
.greek { font-size: 24px; }
.eng { font-size: 22px; }
.greek .t.target { color: var(--red-ink); box-shadow: inset 0 -2px 0 var(--red-ink); }
.eng .w { cursor: pointer; border-radius: 2px; }
.eng .w:hover { background: var(--line); }
.eng .w.core { background: var(--hl); }
.eng .w.ext { box-shadow: inset 0 -3px 0 var(--grp); }
.eng .w:focus-visible { outline: 2px solid var(--red-ink); }
.hint { font-size: 13px; color: var(--faint); }

.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; }
.opt .k { font-family: var(--sans); font-weight: 600; color: var(--mute); }
.opt .p { font-family: var(--greek); font-size: 20px; }
.opt .p.none { font-family: var(--sans); font-size: 16px; color: var(--mute); }
.opt .p .core { background: var(--hl); }
.opt .p .ext { box-shadow: inset 0 -3px 0 var(--grp); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }

.go { display: flex; gap: 10px; flex-wrap: wrap; }
.go button { font: 600 15px var(--sans); padding: 12px 18px; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.go .save { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.go button:disabled { opacity: .4; cursor: default; }
.go button:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }
@media (max-width: 640px) { .greek { font-size: 21px; } .eng { font-size: 19px; } .opt .p { font-size: 18px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="work">Nicomachean Ethics I.2 · Rackham</div>
    <div class="count" id="count"></div>
    <div class="note" id="note" hidden></div>
  </div>
  <div class="strip" id="strip" role="group" aria-label="Items"></div>

  <div class="meta"><span class="ref" id="ref"></span><span class="kind" id="kind"></span><span class="saved" id="saved" hidden>Saved</span></div>
  <div class="greek" id="greek" lang="grc"></div>
  <div class="eng" id="eng"></div>
  <div class="hint">Click an English word: core, then extent, then off.</div>
  <div class="opts" id="opts"></div>
  <div class="go">
    <button id="prev" type="button">Previous</button>
    <button id="save" class="save" type="button">Save and next</button>
  </div>
</div>

<script>
const R = __ITEMS__;
const items = R.items;
const ruled = {};            // g -> saved ruling
let cur = 0, sel = null;     // sel: {core:Set, ext:Set, opt:index|null}
let db = null;

const $ = id => document.getElementById(id);
const words = {};
for (const s of Object.values(R.sents)) for (const [i, w] of s.eng) words[i] = w;
const BEK = l => (l[0] === 'a' ? '1094a' : '1094b') + l.slice(1);

function strip() {
  const s = $('strip'); s.replaceChildren();
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (it.kind === 'check' ? ' check' : '') + (ruled[it.g] ? ' done' : '') + (i === cur ? ' cur' : '');
    b.setAttribute('aria-label', `${it.word}, ${BEK(it.line)}${ruled[it.g] ? ', ruled' : ''}`);
    b.addEventListener('click', () => show(i));
    s.append(b);
  });
  const n = items.filter(it => ruled[it.g]).length;
  $('count').textContent = `${n} of ${items.length} ruled`;
}

function paintEng() {
  for (const w of $('eng').querySelectorAll('.w')) {
    const i = +w.dataset.i;
    w.classList.toggle('core', sel.core.has(i));
    w.classList.toggle('ext', sel.ext.has(i));
  }
  $('opts').querySelectorAll('.opt').forEach((b, j) => b.setAttribute('aria-pressed', sel.opt === j));
}

function same(a, b) { return a.length === b.size && a.every(x => b.has(x)); }
function matchOpt(it) {
  const all = optsOf(it);
  const j = all.findIndex(o => same(o.core, sel.core) && same(o.ext, sel.ext));
  sel.opt = j < 0 ? null : j;
}
function optsOf(it) {
  const all = it.opts.filter(o => o.core.length || o.ext.length);
  all.push({core: [], ext: [], by: [], text: ''});   // "No English" is always offered, and always last
  return all;
}

function show(i) {
  cur = Math.max(0, Math.min(items.length - 1, i));
  const it = items[cur], s = R.sents[it.sent];
  $('ref').textContent = BEK(it.line);
  $('kind').textContent = it.kind === 'check' ? 'Spot check' : 'Disputed';
  $('saved').hidden = !(db && ruled[it.g]);

  const g = $('greek'); g.replaceChildren();
  for (const [id, f, tail] of s.greek) {
    const t = document.createElement('span'); t.className = 't' + (id === it.g ? ' target' : ''); t.textContent = f;
    g.append(t, tail);
  }
  const e = $('eng'); e.replaceChildren();
  for (const [i, w, tail] of s.eng) {
    const b = document.createElement('span'); b.className = 'w'; b.dataset.i = i; b.textContent = w; b.tabIndex = 0;
    b.setAttribute('role', 'button');
    e.append(b, tail);
  }

  const all = optsOf(it), o = $('opts'); o.replaceChildren();
  all.forEach((op, j) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = j + 1;
    const p = document.createElement('span'); p.className = 'p' + (op.text ? '' : ' none');
    const ws = [...op.core, ...op.ext].sort((a, b) => a - b);
    if (!ws.length) p.textContent = 'No English';
    ws.forEach((i, n) => {
      if (n) p.append(i === ws[n - 1] + 1 ? ' ' : ' … ');
      const w = document.createElement('span'); w.textContent = words[i];
      w.className = op.ext.includes(i) ? 'ext' : 'core';
      p.append(w);
    });
    b.append(k, p);
    b.addEventListener('click', () => { sel = {core: new Set(op.core), ext: new Set(op.ext), opt: j}; paintEng(); });
    o.append(b);
  });

  const r = ruled[it.g];
  sel = r ? {core: new Set(r.core), ext: new Set(r.ext), opt: null} : {core: new Set(), ext: new Set(), opt: null};
  if (r) matchOpt(it); else sel.opt = null;
  paintEng(); strip();
  $('prev').disabled = cur === 0;
}

function cycle(i) {
  if (sel.core.has(i)) { sel.core.delete(i); sel.ext.add(i); }
  else if (sel.ext.has(i)) sel.ext.delete(i);
  else sel.core.add(i);
  matchOpt(items[cur]); paintEng();
}
$('eng').addEventListener('click', ev => { const w = ev.target.closest('.w'); if (w) cycle(+w.dataset.i); });
$('eng').addEventListener('keydown', ev => {
  const w = ev.target.closest('.w'); if (w && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); cycle(+w.dataset.i); }
});

async function save() {
  const it = items[cur];
  const all = optsOf(it);
  const body = {
    g: it.g, word: it.word, kind: it.kind,
    core: [...sel.core].sort((a, b) => a - b), ext: [...sel.ext].sort((a, b) => a - b),
    by: sel.opt == null ? ['john'] : all[sel.opt].by.length ? all[sel.opt].by : ['none'],
    at: new Date().toISOString(),
  };
  if (sel.opt == null && !sel.core.size && !sel.ext.size) { $('note').textContent = 'Pick an option or click words first.'; $('note').hidden = false; return; }
  $('note').hidden = true;
  ruled[it.g] = body;
  if (db) {
    try { await db.collection('rulings').doc(it.g).set(body); }
    catch (err) { $('note').textContent = 'Not saved: ' + (err && err.code || 'error') + '. Try again in a moment.'; $('note').hidden = false; delete ruled[it.g]; strip(); return; }
  }
  const next = items.findIndex((x, j) => j > cur && !ruled[x.g]);
  show(next >= 0 ? next : Math.min(cur + 1, items.length - 1));
}
$('save').addEventListener('click', save);
$('prev').addEventListener('click', () => show(cur - 1));
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('.w')) return;
  if (ev.key >= '1' && ev.key <= '9') { const b = $('opts').children[+ev.key - 1]; if (b) b.click(); }
  else if (ev.key === 'Enter' && !(ev.target.closest && ev.target.closest('button'))) save();
  else if (ev.key === 'ArrowRight') show(cur + 1);
  else if (ev.key === 'ArrowLeft') show(cur - 1);
});

show(0);

(async () => {
  db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { $('note').textContent = 'Rulings cannot be saved in this view.'; $('note').hidden = false; return; }
  let first = true;
  const timer = setTimeout(() => { $('note').textContent = 'Saved rulings cannot be reached yet.'; $('note').hidden = false; }, 10000);
  db.collection('rulings').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); if ($('note').textContent.startsWith('Saved rulings')) $('note').hidden = true; }
    for (const k of Object.keys(ruled)) delete ruled[k];
    for (const d of snap.docs) ruled[d.id] = d.data();
    if (first) { first = false; const j = items.findIndex(x => !ruled[x.g]); show(j >= 0 ? j : 0); }
    else { strip(); $('saved').hidden = !ruled[items[cur].g]; }
  }, err => { clearTimeout(timer); $('note').textContent = 'Saved rulings cannot be read: ' + err.code; $('note').hidden = false; });
})();
</script>
