# Aristotle (school of), Athenian Constitution — pipeline manifest.
#
# The FIRST work cited by chapter.section. The papyrus came to light in 1890,
# after Bekker, so the work has no Bekker numbers. citation.scheme
# chapter-section carries it on synthetic columns: chapter N is column "Na"
# (a-side only), section S is line S, and each section is one Greek spine line
# (stage1_greek._parse_sections), so the column:line pipeline and reader run
# unchanged and only the labels read "49.3". Plan: docs/ath-pol-plan.md.
#
# Greek: TLG 0086.003, Oppermann (Teubner 1928): 69 chapters, 298 sections.
# English: F. G. Kenyon, Oxford Works vol. X (1921), public domain, which numbers
# the sections in its margin. Three of his sections sit inside one of
# Oppermann's (15.5, 26.4, 49.5). One real English tick per Greek section, from
# sources/athpol-kenyon/anchors.yaml (pipeline/tools/build_athpol_kenyon.py).
#
# No authenticity mark: Barnes's Revised Oxford Translation (1984) prints it
# unmarked, and John ruled "Match Barnes" (2026-11-06).

work:
  id: AthPol
  title: "Athenian Constitution"
  greekTitle: "Ἀθηναίων πολιτεία"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "003"
  greek_edition: "H. Oppermann, Aristotelis Ἀθηναίων πολιτεία (Teubner, Leipzig 1928)"
  english_translation: "F. G. Kenyon (Oxford, 1921)"

citation:
  scheme: chapter-section
  # Sections per chapter in Kenyon's 1921 numbering, read from the margins of
  # the scan (archive.org worksofaristotle0010wdro_x8m2 /page/n370–n448): 301.
  # The margin prints 300 numerals: chapter 8 runs 1, 2, 4, 5, with no 3 printed
  # (Oppermann's 8.3 starts at "There were four tribes").
  english_sections: [1, 3, 6, 5, 3, 4, 4, 5, 2, 2, 2, 5, 5, 4, 5, 10, 4, 6, 6, 5, 6, 8, 5, 3, 4, 4, 5, 5, 5, 6, 3, 3, 2, 3, 4, 2, 2, 4, 6, 4, 3, 5, 6, 4, 4, 2, 5, 5, 5, 2, 4, 3, 7, 8, 5, 7, 4, 3, 7, 3, 7, 3, 5, 5, 4, 3, 5, 4, 2]
  # Sections per chapter in the TLG export (tools/athpol_greek_starts.py): 298.
  greek_sections: [1, 3, 6, 5, 3, 4, 4, 5, 2, 2, 2, 5, 5, 4, 4, 10, 4, 6, 6, 5, 6, 8, 5, 3, 4, 3, 5, 5, 5, 6, 3, 3, 2, 3, 4, 2, 2, 4, 6, 4, 3, 5, 6, 4, 4, 2, 5, 5, 4, 2, 4, 3, 7, 8, 5, 7, 4, 3, 7, 3, 7, 3, 5, 5, 4, 3, 5, 4, 2]
  # The only differences allowed between the two: a section of Kenyon's that
  # Oppermann prints inside the one before. 15.5 "Pisistratus accordingly…",
  # 26.4 "and two years afterwards, in the archonship of Antidotus…", 49.5
  # "The Council also, speaking broadly, co-operates…". They get no tick.
  merges:
    - { chapter: 15, english: 5, into: 4 }
    - { chapter: 26, english: 4, into: 3 }
    - { chapter: 49, english: 5, into: 4 }
  # Each Greek section's opening words, recorded from the export.
  starts: "athpol-greek-starts.yaml"

