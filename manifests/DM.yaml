# De Mundo ("On the Cosmos") — pipeline manifest.
#
# A spurious cosmological treatise (Bekker 391a–401b), addressed to Alexander.
# Greek spine from the cached TLG export (tlg0086.028); 7 chapters from the
# Perseus/First1KGreek grc TEI (subtype="chapter"), text-aligned onto the
# Bekker-lineated spine. Primary English = E. S. Forster (Oxford, 1914), public
# domain; archive-model with an interpolated gutter.

work:
  id: DM
  title: "De Mundo"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "028"
  authenticity: spurious
  greek_edition: "I. Bekker, Aristotelis Opera (Berlin, 1831)"
  english_translation: "E. S. Forster (Oxford, 1914)"

bekker_range:
  first_column: "391a"
  last_column: "401b"

chapters:
  source: grc_tei
  grc_tei: "tlg0086.tlg028.perseus-grc2.xml"
  chapter_subtype: chapter

english:
  primary:
    id: forster
    name: "E. S. Forster (Oxford, 1914)"
    model: archive
    dir: "dm-forster"
    books: 1
    chapter_marker: part

books:
  - { n: 1, start: "391a1", end: "401b29" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
