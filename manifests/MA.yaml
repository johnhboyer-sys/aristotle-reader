  title: "Movement of Animals"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "021"
  greek_edition: "Jaeger, Aristotelis De animalium motione (Teubner, 1913)"
  english_translation: "A. S. L. Farquharson (Oxford, 1912)"

