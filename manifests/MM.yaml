# Magna Moralia — pipeline manifest.
#
# A dubious ethical treatise in two books (Bekker 1181a24–1213b30). The Greek
# is the cached TLG export (tlg0086.022: Susemihl's text as printed in the
# Loeb, 1935), which is divided by book, chapter and section but carries no
# Bekker numbers. Its Bekker lines come from Bekker's own printed pages
# (Berlin, 1831): `greek.lineation` names the line map that
# pipeline/tools/mm_bekker_lines.py reads off the scan, and stage1_relineate
# splits the TLG text at it. Chapters are TLG's (= Susemihl's) divisions,
# placed through the same map (`chapters.source: explicit`, with the word of
# the line each opens on); tests/test_mm_bekker_lines.py keeps the list in
# step with the map. Primary English = St. George Stock (Oxford, 1915), public
# domain, archive model; its Bekker ticks are Stock's printed margins.

work:
  id: MM
  title: "Magna Moralia"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "022"
  authenticity: dubious
  greek_edition: "F. Susemihl (Leipzig, 1883), as printed by G. C. Armstrong (Loeb, 1935); lines of I. Bekker, Aristotelis Opera (Berlin, 1831)"
  english_translation: "St. G. Stock (Oxford, 1915)"

greek:
  lineation: "mm-bekker/bekker-lines.yaml"

bekker_range:
  first_column: "1181a"
  last_column: "1213b"

chapters:
  source: explicit
  # from tools/mm_bekker_lines.py --chapters; tests/test_mm_bekker_lines.py
  # holds it to the line map. `word` = the TLG word in that Bekker line where
  # the chapter opens.
  list:
    - { book: 1, n: 1, bekker: "1181a24", word: 0 }
    - { book: 1, n: 2, bekker: "1183b19", word: 0 }
    - { book: 1, n: 3, bekker: "1184b1", word: 0 }
    - { book: 1, n: 4, bekker: "1184b22", word: 0 }
    - { book: 1, n: 5, bekker: "1185b1", word: 1 }
