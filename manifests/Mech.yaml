# Mechanica ("Mechanical Problems") — pipeline manifest.
#
# A spurious mechanical treatise (Bekker 847a–858b). Greek spine from the
# cached TLG export (tlg0086.023); its 36 chapter divisions correspond to the
# preface and thirty-five problems. Primary English = E. S. Forster (Oxford,
# 1913), public domain; archive-model with an interpolated gutter.

work:
  id: Mech
  title: "Mechanica"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "023"
  authenticity: spurious
  greek_edition: "I. Bekker, Aristotelis Opera (Berlin, 1831)"
  english_translation: "E. S. Forster (Oxford, 1913)"

bekker_range:
  first_column: "847a"
  last_column: "858b"

chapters:
  source: grc_tei
  grc_tei: "tlg0086.tlg023.1st1K-grc1.xml"
  chapter_subtype: chapter
  # First1KGreek's 36 chapter divs (n=0..35) map to Forster's 35 Parts as:
  # div 0 = the preface (Part 1); divs 1..7 = Parts 2..8; divs 9..35 = Parts
  # 9..35. Two divs are defective and are skipped:
  #   n=8  — a spurious second div splitting problem 8's answer ("Εἰ μὲν δὴ…");
  #          it is not a Διὰ τί problem and has no Forster Part.
  #   n=27 — problem 27's div, whose opening orthography diverges from the spine
  #          and whose milestone is page-only (857a), so text-alignment mis-pins
  #          it at 857a5 (colliding with div 26). It is re-pinned via `extra`
  #          below at its authoritative Bekker start.
  # Result: 34 aligned divs + 1 extra = 35 chapters, 1:1 with Forster's Parts.
  chapter_renumber: sequential
  skip: [8, 27]
  extra:
    - { n: 27, bekker: "857a22" }

english:
  primary:
    id: forster
    name: "E. S. Forster (Oxford, 1913)"
    model: archive
    dir: "mech-forster"
    books: 1
    chapter_marker: part

books:
  - { n: 1, start: "847a1", end: "858b31" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
