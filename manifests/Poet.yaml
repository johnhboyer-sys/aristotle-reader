# Poetics — pipeline manifest
#
# A single-book work (26 chapters, no book divisions). Greek spine from the
# cached TLG export; chapter structure from the Perseus grc TEI; English is
# W. H. Fyfe's prose (extracted from the Perseus eng TEI into sources/poet-fyfe/
# by tools/extract_fyfe_poetics.py) served via the archive path, with a dense
# per-line Bekker gutter from the gloss aligner's anchors.yaml.

work:
  id: Poet
  title: "Poetics"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "034"
  greek_edition: "Kassel, Aristotelis De Arte Poetica (OCT, 1965)"
  english_translation: "W. H. Fyfe (Loeb, 1932)"

bekker_range:
  first_column: "1447a"
  last_column: "1462b"

chapters:
  source: grc_tei
  grc_tei: "tlg0086.tlg034.perseus-grc2.xml"
  chapter_subtype: chapter

english:
  primary:
    id: fyfe
    name: "W. H. Fyfe (Loeb, 1932)"
    model: archive
    dir: "poet-fyfe"
    books: 1
    chapter_marker: part
    anchors: "poet-fyfe/anchors.yaml"
  # Second translation: S. H. Butcher (Macmillan, 1895), public domain. Sourced
  # from the MIT Internet Classics Archive (poetics.mb.txt), one book of 26
  # "Part <Roman>" chapters. Tier 0: no anchors file — chapters are pinned to the
  # Greek spine via the grc TEI (chapters.source: grc_tei), so chapter-level
  # Bekker is exact; the within-chapter line gutter is interpolated (estimates).
  secondary:
    id: butcher
    name: "S. H. Butcher (Macmillan, 1895)"
    model: archive
    dir: "poet-butcher"
    books: 1
    chapter_marker: part_roman

# The TLG edition's line numbering skips these single line numbers (the Greek
# text is continuous across them — verified); declared so the validator passes.
expected_line_gaps:
  - { column: "1449a", after: 28, next: 30 }
  - { column: "1454b", after: 33, next: 35 }

books:
  - { n: 1, start: "1447a1", end: "1462b19" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
