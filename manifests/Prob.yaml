# Problemata — pipeline manifest.
#
# A collection of doubted authorship (Barnes 1984: *) of 38 books of "problems" (Bekker 859a-967b). Greek spine from the
# cached TLG export (tlg0086.036); chapter structure from the First1KGreek TEI, one chapter
# per problem (889 in all). Primary English = E. S. Forster (Oxford, The Works of Aristotle
# vol. VII, 1927), public domain; archive-model with a gutter read from the printed marginal
# line numbers (sources/prob-forster/anchors.yaml).

work:
  id: Prob
  title: "Problemata"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "036"
  authenticity: dubious  # Barnes 1984 marks it * (doubted)
  greek_edition: "I. Bekker, Aristotelis Opera (Berlin, 1831)"
  english_translation: "E. S. Forster (Oxford, 1927)"

bekker_range:
  first_column: "859a"
  last_column: "967b"

chapters:
  source: grc_tei
  grc_tei: "tlg0086.tlg036.1st1K-grc1.xml"
  chapter_subtype: chapter
  # First1KGreek has 889 problem divs, Forster prints 890 problems; 36 of the 38 books agree 1:1.
  # Book 1: the TEI has no div n=6 (its 55 divs are numbered 1-5, 7-56). Bekker's text
  # has the problem at 859b5 ("Διὰ τί τῶν ἀπὸ χολῆς νοσημάτων ἐν τῷ θέρει ... ὀξέα ... ἐν
  # τῷ χειμῶνι"), and Forster prints it as problem 6 ("Why is it that, though the
  # diseases due to bile occur in the summer ... acute diseases due to bile occur
  # rather in the winter?"), so it is added back with `extra`: 56 Parts, 56 chapters.
  #
  # Book 3: Forster numbers 1-24, 25a, 25b, 26-35 (36 problems under 35 numbers), and the TEI
  # has 36 divs (n=25a follows n=25), but the pipeline reads only numeric divs and drops
  # n="25a": its chapters are 1-35. Parts 25a and 25b are therefore one Part 25, as under
  # Forster's one number; pipeline/tools/build_prob_forster.py reads them together (MERGE) and
  # the paragraph break between them is not kept (the source has no paragraphs.yaml).
  #
  # `skip: [28, 29, 40, 54]` + `extra`: the aligner finds each chapter by its first eight words,
  # in order, and cannot be told to skip one chapter in one book; `skip` drops a chapter number
  # in every book, and `extra` puts each back at the Bekker line where its opening stands in
  # Bekker's text (for the books where the aligner had it right, the line it found).
  #   n=40 and n=54 of Book 10: the TEI's opening differs from Bekker's by a word ("τῶν ἄλλων
  #   ζῴων" for "τῶν ζῴων"; "μάλιστα τῶν ζῴων" for "τῶν ζῴων μάλιστα"), so the search runs on
  #   to a later repeat of the problem (905a, 950b) and every chapter after it is lost.
  #   n=28 of Book 20: chapters 27 and 28 begin with the same eight words ("Διὰ τί ποτε τὰ
  #   σκόροδα καὶ τὰ κρόμμυα"), parting at the ninth ("ὅσῳ" / "μόνα"); both land on 926a11, so
  #   chapter 28 holds no Greek. Bekker has them at 926a11 and 926a16. With 28 gone, Book 10's
  #   chapter 29 (which repeats the opening of its chapter 27) would land on chapter 27, so n=29
  #   is pinned too.
  skip: [28, 29, 40, 54]
  extra:
    - { book: 1, n: 29, bekker: "862b25" }
    - { book: 2, n: 29, bekker: "869a19" }
    - { book: 3, n: 29, bekker: "875b5" }
    - { book: 4, n: 29, bekker: "880a22" }
    - { book: 5, n: 29, bekker: "883b37" }
    - { book: 10, n: 29, bekker: "894a12" }
    - { book: 11, n: 29, bekker: "902b9" }
    - { book: 19, n: 29, bekker: "920a3" }
    - { book: 20, n: 29, bekker: "926a21" }
    - { book: 23, n: 29, bekker: "934b9" }
    - { book: 26, n: 29, bekker: "943a32" }
    - { book: 31, n: 29, bekker: "960a29" }
    - { book: 1, n: 6, bekker: "859b5" }
    - { book: 1, n: 28, bekker: "862b16" }
    - { book: 1, n: 40, bekker: "863b29" }
    - { book: 1, n: 54, bekker: "866a5" }
    - { book: 2, n: 28, bekker: "869a13" }
    - { book: 2, n: 40, bekker: "870b6" }
    - { book: 3, n: 28, bekker: "875b1" }
    - { book: 4, n: 28, bekker: "880a11" }
    - { book: 5, n: 28, bekker: "883b33" }
    - { book: 5, n: 40, bekker: "885a14" }
    - { book: 10, n: 28, bekker: "894a7" }
    - { book: 10, n: 40, bekker: "895a15" }
    - { book: 10, n: 54, bekker: "897a1" }
    - { book: 11, n: 28, bekker: "902a36" }
    - { book: 11, n: 40, bekker: "903b30" }
    - { book: 11, n: 54, bekker: "905a16" }
    - { book: 19, n: 28, bekker: "919b38" }
    - { book: 19, n: 40, bekker: "921a32" }
    - { book: 20, n: 28, bekker: "926a16" }
    - { book: 23, n: 28, bekker: "934b4" }
    - { book: 23, n: 40, bekker: "935b34" }
    - { book: 26, n: 28, bekker: "943a28" }
    - { book: 26, n: 40, bekker: "945a1" }
    - { book: 26, n: 54, bekker: "946a35" }
    - { book: 31, n: 28, bekker: "960a21" }

