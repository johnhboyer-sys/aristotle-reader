# Sense and Sensibilia (De Sensu) — pipeline manifest
#
# A single-book Parva Naturalia treatise (no book divisions). Greek spine from
# the cached TLG export; chapter structure from the First1KGreek grc TEI;
# English from the MIT archive (J. I. Beare) via the chapter-anchored archive path.

work:
  id: Sens
  title: "Sense and Sensibilia"
  author: "Aristotle"
  tlg_author: "0086"
  tlg_work: "041"
  greek_edition: "Ross, Aristotle: Parva Naturalia (Oxford, 1955)"
  english_translation: "J. I. Beare (Oxford, 1908)"

bekker_range:
  first_column: "436a"
  last_column: "449b"

chapters:
  source: grc_tei
  grc_tei: "tlg0086.tlg041.1st1K-grc1.xml"
  # Div 7's opening ("Ἔστι δέ τις ἀπορία…") differs in word order from the
  # spine ("Ἔστι δ' ἀπορία… τις"), so text-alignment mis-pins it at 448a28,
  # mid-sentence, on a 3-word hit. It is re-pinned via `extra` at 447a12,
  # where both the Greek and Beare's Part 7 begin.
  skip: [7]
  extra:
    - { n: 7, bekker: "447a12" }

english:
  primary:
    id: beare
    name: "J. I. Beare (Oxford, 1908)"
    model: archive
    dir: "sens-beare"
    books: 1
    chapter_marker: part
    anchors: "sens-beare/anchors.yaml"

books:
  - { n: 1, start: "436a1", end: "449b4" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
