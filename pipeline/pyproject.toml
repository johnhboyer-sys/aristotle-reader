[project]
name = "aristotle-pipeline"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "lxml>=6.1.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Heavy ML deps used only by the alignment / gloss-aligner tooling
# (sentence_transformers is lazy-imported in align/similarity.py and pulls in
# torch, transformers, scipy, numpy, etc.). Install with: uv sync --extra align
align = [
    "sentence-transformers>=2.2",
]
# tools/ugarit_align.py only. XLM-R's tokenizer is a sentencepiece model and the
# UGARIT repo ships no tokenizer.json, so the slow→fast conversion needs
# sentencepiece + protobuf at load time. Install with: uv sync --extra ugarit
ugarit = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]
